<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List App</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 500px;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        .input-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        #taskInput {
            flex: 1;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }

        #addBtn {
            padding: 13px 20px;
            border: none;
            border-radius: 10px;
            background: #667eea;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        #addBtn:hover {
            background: #5568d8;
        }

        .filters {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .filter {
            border: none;
            background: #eee;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
        }

        .filter.active {
            background: #667eea;
            color: white;
        }

        #taskList {
            list-style: none;
        }

        .task {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #f7f7f7;
            padding: 13px;
            margin-bottom: 10px;
            border-radius: 10px;
        }

        .task span {
            flex: 1;
            color: #333;
            word-break: break-word;
        }

        .task.completed span {
            text-decoration: line-through;
            color: #999;
        }

        .delete-btn {
            border: none;
            background: #ff4d4d;
            color: white;
            padding: 7px 10px;
            border-radius: 7px;
            cursor: pointer;
        }

        .delete-btn:hover {
            background: #e63939;
        }

        .bottom {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            color: #666;
            font-size: 14px;
        }

        #clearBtn {
            border: none;
            background: none;
            color: #667eea;
            cursor: pointer;
        }

        @media (max-width: 500px) {
            .container {
                padding: 20px;
            }

            .input-box {
                flex-direction: column;
            }

            #addBtn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>📝 To-Do List</h1>

        <div class="input-box">
            <input
                type="text"
                id="taskInput"
                placeholder="Enter a task..."
            >

            <button id="addBtn">
                Add
            </button>
        </div>

        <div class="filters">

            <button class="filter active" data-filter="all">
                All
            </button>

            <button class="filter" data-filter="active">
                Active
            </button>

            <button class="filter" data-filter="completed">
                Completed
            </button>

        </div>

        <ul id="taskList"></ul>

        <div class="bottom">

            <span id="taskCount">
                0 tasks
            </span>

            <button id="clearBtn">
                Clear Completed
            </button>

        </div>

    </div>


    <script>

        const taskInput = document.getElementById("taskInput");
        const addBtn = document.getElementById("addBtn");
        const taskList = document.getElementById("taskList");
        const taskCount = document.getElementById("taskCount");
        const clearBtn = document.getElementById("clearBtn");
        const filters = document.querySelectorAll(".filter");

        let tasks = JSON.parse(
            localStorage.getItem("tasks")
        ) || [];

        let currentFilter = "all";


        // Add task
        function addTask() {

            const text = taskInput.value.trim();

            if (text === "") {
                alert("Please enter a task!");
                return;
            }

            const task = {
                id: Date.now(),
                text: text,
                completed: false
            };

            tasks.push(task);

            saveTasks();

            taskInput.value = "";

            displayTasks();
        }


        // Display tasks
        function displayTasks() {

            taskList.innerHTML = "";

            let filteredTasks = tasks;

            if (currentFilter === "active") {

                filteredTasks = tasks.filter(
                    task => !task.completed
                );

            } else if (currentFilter === "completed") {

                filteredTasks = tasks.filter(
                    task => task.completed
                );
            }


            filteredTasks.forEach(task => {

                const li = document.createElement("li");

                li.className =
                    "task " +
                    (task.completed ? "completed" : "");


                li.innerHTML = `

                    <input
                        type="checkbox"
                        ${task.completed ? "checked" : ""}
                        onchange="toggleTask(${task.id})"
                    >

                    <span>${escapeHTML(task.text)}</span>

                    <button
                        class="delete-btn"
                        onclick="deleteTask(${task.id})"
                    >
                        Delete
                    </button>

                `;

                taskList.appendChild(li);

            });


            updateCount();
        }


        // Complete / incomplete
        function toggleTask(id) {

            tasks = tasks.map(task => {

                if (task.id === id) {
                    task.completed = !task.completed;
                }

                return task;

            });

            saveTasks();

            displayTasks();
        }


        // Delete task
        function deleteTask(id) {

            tasks = tasks.filter(
                task => task.id !== id
            );

            saveTasks();

            displayTasks();
        }


        // Clear completed tasks
        clearBtn.addEventListener("click", () => {

            tasks = tasks.filter(
                task => !task.completed
            );

            saveTasks();

            displayTasks();

        });


        // Filters
        filters.forEach(button => {

            button.addEventListener("click", () => {

                filters.forEach(btn =>
                    btn.classList.remove("active")
                );

                button.classList.add("active");

                currentFilter =
                    button.dataset.filter;

                displayTasks();

            });

        });


        addBtn.addEventListener("click", addTask);


        taskInput.addEventListener("keypress", event => {

            if (event.key === "Enter") {
                addTask();
            }

        });


        function saveTasks() {

            localStorage.setItem(
                "tasks",
                JSON.stringify(tasks)
            );

        }


        function updateCount() {

            const activeTasks =
                tasks.filter(
                    task => !task.completed
                ).length;

            taskCount.textContent =
                activeTasks +
                (activeTasks === 1 ? " task" : " tasks");

        }


        function escapeHTML(text) {

            const div =
                document.createElement("div");

            div.textContent = text;

            return div.innerHTML;

        }

        displayTasks();

    </script>

</body>
</html>
